<!DOCTYPE html>

<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./家計簿_files/css2" rel="stylesheet">
<style>
  :root{
    --paper:#f4f0e6;
    --card:#fffdf8;
    --ink:#2b2620;
    --ink-soft:#6b6155;
    --line:#d8cfbd;
    --accent:#c65d3b;
    --accent-soft:#f0d9c9;
    --ok:#4c7a5c;
    --err:#b3423a;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, #faf6ec 0%, var(--paper) 55%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{
    width:100%;
    max-width:420px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 4px;
  }
  .brand h1{
    font-size:22px;
    font-weight:900;
    letter-spacing:.02em;
    margin:0;
  }
  .brand span{
    font-size:12px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
  }
  .ticket{
    position:relative;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 18px 40px -20px rgba(43,38,32,.35), 0 2px 0 rgba(43,38,32,.03);
    padding:26px 22px 22px;
    border:1px solid var(--line);
  }
  .perf{
    position:absolute;
    left:0; right:0;
    top:118px;
    height:0;
    border-top:2px dashed var(--line);
  }
  .perf::before, .perf::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px; height:22px;
    background:var(--paper);
    border-radius:50%;
  }
  .perf::before{ left:-32px; }
  .perf::after{ right:-32px; }

  .amount-block{
    text-align:center;
    padding-bottom:26px;
  }
  .amount-label{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:6px;
  }
  .amount-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:4px;
  }
  .amount-row span{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    color:var(--ink-soft);
  }
  #amount{
    width:220px;
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:42px;
    text-align:center;
    color:var(--ink);
    outline:none;
  }
  #amount::placeholder{ color:#cfc4b2; }

  .fields{
    padding-top:26px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:6px;
  }
  .field select, .field input[type="date"], .field input[type="text"]{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fffefb;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%236b6155' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  .field select:focus, .field input:focus{
    border-color:var(--accent);
  }
  .row2{
    display:flex;
    gap:12px;
  }
  .row2 .field{ flex:1; }

  .submit{
    margin-top:22px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff8f2;
    font-size:16px;
    font-weight:700;
    letter-spacing:.05em;
    cursor:pointer;
    transition:transform .08s ease, opacity .2s ease;
  }
  .submit:active{ transform:scale(.98); }
  .submit:disabled{ opacity:.55; cursor:default; }

  .msg{
    margin-top:14px;
    text-align:center;
    font-size:13px;
    font-weight:500;
    min-height:18px;
  }
  .msg.ok{ color:var(--ok); }
  .msg.err{ color:var(--err); }

  .setup{
    margin-top:16px;
    padding:12px 14px;
    background:#fff3e0;
    border:1px solid #f0d9c9;
    border-radius:12px;
    font-size:12px;
    line-height:1.6;
    color:#7a5a2a;
    display:none;
  }
  .setup.show{ display:block; }
  .setup code{
    background:#fff;
    padding:1px 5px;
    border-radius:5px;
    font-size:11px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>家計簿</h1>
    <span id="today-label">2026/07/23</span>
  </div>

  <div class="ticket">
    <div class="amount-block">
      <div class="amount-label">金額</div>
      <div class="amount-row">
        <span>¥</span>
        <input id="amount" type="number" inputmode="numeric" placeholder="0" min="0" step="1" required="">
      </div>
    </div>

    <div class="perf"></div>

    <form id="entry-form">
      <div class="fields">
        <div class="field">
          <label for="date">利用日</label>
          <input id="date" type="date" required="">
        </div>

        <div class="row2">
          <div class="field">
            <label for="category">分類</label>
            <select id="category" required=""><option value="食費">🍚 食費</option><option value="カフェ">☕ カフェ</option><option value="ガソリン">⛽ ガソリン</option><option value="高速道路">🛣️ 高速道路</option><option value="車用品">🚗 車用品</option><option value="趣味">🎮 趣味</option><option value="衣類">👕 衣類</option><option value="日用品">🧴 日用品</option><option value="医療">🏥 医療</option><option value="交通">🚃 交通</option><option value="通信">📱 通信</option><option value="住居">🏠 住居</option><option value="税金">📋 税金</option><option value="給料">💰 給料</option><option value="賞与">🎁 賞与</option><option value="その他収入">💴 その他収入</option><option value="その他支出">📦 その他支出</option></select>
          </div>
          <div class="field">
            <label for="payment">支払方法</label>
            <select id="payment" required=""><option value="現金">💵 現金</option><option value="Visa">💳 Visa</option><option value="Master">💳 Master</option><option value="JCB">💳 JCB</option><option value="QUICPay">📶 QUICPay</option><option value="iD">📶 iD</option><option value="PayPay">📱 PayPay</option><option value="Suica">🚉 Suica</option><option value="その他">➕ その他</option></select>
          </div>
        </div>

        <div class="field">
          <label for="memo">メモ（任意）</label>
          <input id="memo" type="text" placeholder="例）ラーメン">
        </div>
      </div>

      <button type="submit" class="submit" id="submit-btn">登録する</button>
      <div class="msg err" id="msg">保存先が未設定です（上の案内を確認してください）</div>
      <div class="setup show" id="setup-msg">
        まだ保存先が設定されていません。Google Apps Scriptをデプロイして、コード先頭の<code>GAS_URL</code>に発行されたURLを貼り付けてください。
      </div>
    </form>
  </div>
</div>

<script>
  // ▼▼▼ ここにGoogle Apps ScriptのウェブアプリURLを貼り付ける ▼▼▼
  const GAS_URL = "https://script.google.com/macros/s/AKfycbztw0o4p4pQTW411BRRGqjErYa3y-vbXhDiVQ0qiyJWTJ4SbzejMW0zJRhEUMiEvYPkMQ/exec";
  // ▲▲▲ ここまで ▲▲▲

  const CATEGORIES = [
    ["食費","🍚"], ["カフェ","☕"], ["ガソリン","⛽"], ["高速道路","🛣️"],
    ["車用品","🚗"], ["趣味","🎮"], ["衣類","👕"], ["日用品","🧴"],
    ["医療","🏥"], ["交通","🚃"], ["通信","📱"], ["住居","🏠"],
    ["税金","📋"], ["給料","💰"], ["賞与","🎁"], ["その他収入","💴"], ["その他支出","📦"]
  ];
  const PAYMENTS = [
    ["現金","💵"], ["Visa","💳"], ["Master","💳"], ["JCB","💳"],
    ["QUICPay","📶"], ["iD","📶"], ["PayPay","📱"], ["Suica","🚉"], ["その他","➕"]
  ];

  function fillSelect(el, items){
    el.innerHTML = items.map(([name, icon]) =>
      `<option value="${name}">${icon} ${name}</option>`).join("");
  }
  fillSelect(document.getElementById("category"), CATEGORIES);
  fillSelect(document.getElementById("payment"), PAYMENTS);

  const dateInput = document.getElementById("date");
  const todayLabel = document.getElementById("today-label");
  function setToday(){
    const d = new Date();
    const iso = d.toISOString().slice(0,10);
    dateInput.value = iso;
    todayLabel.textContent = iso.replace(/-/g, "/");
  }
  setToday();

  const form = document.getElementById("entry-form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submit-btn");
  const setupMsg = document.getElementById("setup-msg");

  if (GAS_URL.indexOf("PASTE_YOUR_GAS_WEBAPP_URL_HERE") !== -1){
    setupMsg.classList.add("show");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    msg.className = "msg";

    const amount = document.getElementById("amount").value;
    if (!amount || Number(amount) <= 0){
      msg.textContent = "金額を入力してください";
      msg.classList.add("err");
      return;
    }
    if (GAS_URL.indexOf("PASTE_YOUR_GAS_WEBAPP_URL_HERE") !== -1){
      msg.textContent = "保存先が未設定です（上の案内を確認してください）";
      msg.classList.add("err");
      return;
    }

    const payload = {
      date: dateInput.value,
      amount: Number(amount),
      category: document.getElementById("category").value,
      payment: document.getElementById("payment").value,
      memo: document.getElementById("memo").value
    };

    btn.disabled = true;
    btn.textContent = "登録中…";

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data && data.result === "ok"){
        msg.textContent = "登録しました ✓";
        msg.classList.add("ok");
        document.getElementById("amount").value = "";
        document.getElementById("memo").value = "";
      } else {
        throw new Error(data && data.message ? data.message : "unknown error");
      }
    } catch(err){
      msg.textContent = "登録に失敗しました（" + err.message + "）";
      msg.classList.add("err");
    } finally {
      btn.disabled = false;
      btn.textContent = "登録する";
    }
  });
</script>


</body></html>
