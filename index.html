<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="brand">
    <h1>家計簿</h1>
    <span id="today-label"></span>
  </div>

  <div class="ticket">
    <div class="amount-block">
      <div class="amount-label">金額</div>
      <div class="amount-row">
        <span>¥</span>
        <input id="amount" type="number" inputmode="numeric" placeholder="0" min="0" step="1" required>
      </div>
    </div>

    <div class="perf"></div>

    <form id="entry-form">
      <div class="fields">
        <div class="field">
          <label for="date">利用日</label>
          <input id="date" type="date" required>
        </div>

        <div class="row2">
          <div class="field">
            <label for="category">分類</label>
            <select id="category" required></select>
          </div>
          <div class="field">
            <label for="payment">支払方法</label>
            <select id="payment" required></select>
          </div>
        </div>

        <div class="field">
          <label for="memo">メモ（任意）</label>
          <input id="memo" type="text" placeholder="例）ラーメン">
        </div>
      </div>

      <button type="submit" class="submit" id="submit-btn">登録する</button>
      <div class="msg" id="msg"></div>
      <div class="setup" id="setup-msg">
        まだ保存先が設定されていません。<code>js/config.js</code>の<code>GAS_URL</code>にデプロイしたURLを貼り付けてください。
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
